<!DOCTYPE html>
<html lang="en"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fleet Service Tracker</title>
<style>:root{--navy:#1F3864;--blue:#2E75B6;--bg:#f3f5f9;--card:#fff;--line:#d9dee8;--txt:#1b2333;--mut:#667085;--ok:#1e8e4e;--bad:#c0392b;--warn:#b7791f;--okbg:#e3f5ea;--badbg:#fde8e6;--warnbg:#fff4d6}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",Arial,Helvetica,sans-serif;font-size:14px;color:var(--txt);background:var(--bg)}
header.top{background:var(--navy);color:#fff;display:flex;align-items:center;gap:20px;padding:0 20px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;padding:14px 0;white-space:nowrap}
nav{display:flex;gap:2px;flex:1;flex-wrap:wrap}
nav button{background:none;border:0;color:#cfd8ea;padding:16px 14px;cursor:pointer;font:inherit;border-bottom:3px solid transparent}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-bottom-color:#7fb2e5;font-weight:600}
#saved{font-size:12px;color:#b8c6e0;white-space:nowrap}
main{padding:20px;max-width:1500px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px;color:var(--navy)}h3{font-size:14px;margin:0 0 8px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
button.btn{background:var(--blue);color:#fff;border:0;border-radius:7px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
button.btn:hover{background:#25639a}
button.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}
button.btn.sec:hover{background:#eef2f8}
button.btn.danger{background:#fff;color:var(--bad);border:1px solid #f0c4be}
button.btn.danger:hover{background:var(--badbg)}
button.btn.sm{padding:4px 9px;font-size:12px}
input,select,textarea{font:inherit;color:inherit;border:1px solid #c5ccda;border-radius:6px;padding:6px 8px;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #9cc4ee;border-color:var(--blue)}
input[type=checkbox]{width:auto}
textarea{resize:vertical;min-height:54px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.grid .wide{grid-column:1/-1}.grid .w2{grid-column:span 2}
.f>span{display:block;font-size:12px;color:var(--mut);margin-bottom:3px;font-weight:600}
.f.chk{display:flex;align-items:center;gap:8px;padding-top:20px}
.dt{display:flex;gap:4px}
button.now{border:1px solid var(--line);background:#eef2f8;border-radius:6px;padding:0 8px;cursor:pointer;font-size:12px;color:var(--navy);font-weight:600}
button.now:hover{background:#dde6f3}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mut);background:#f7f9fc;position:sticky;top:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:#f0f5fc}
.tw{overflow:auto;max-height:70vh}
td.n,th.n{text-align:right}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#e7ebf3;color:#44506a}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.bad{background:var(--badbg);color:var(--bad)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.blue{background:#dcebfa;color:#1d5f9e}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.dside{position:sticky;top:64px}
@media(max-width:1050px){.detail{grid-template-columns:1fr}.dside{position:static;order:-1}}
.line{border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:10px;background:#fbfcfe}
.line .calc{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mut)}
.line .calc b{color:var(--txt)}
.line .hd{display:flex;align-items:center;margin-bottom:8px;gap:8px}.line .hd b{color:var(--navy)}
.picker{position:relative}
.plist{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--blue);border-radius:7px;box-shadow:0 8px 24px rgba(20,40,80,.18);z-index:30;max-height:300px;overflow:auto}
.plist[hidden]{display:none}
.popt{padding:7px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #f0f2f6}
.popt:hover{background:#eaf3fc}.popt small{color:var(--mut)}.popt.add{color:var(--blue);font-weight:600}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-size:24px;color:var(--navy)}.kpi span{color:var(--mut);font-size:12px}
.bar{height:9px;border-radius:5px;background:#e7ebf3;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--blue)}
.srow{display:grid;grid-template-columns:130px 1fr 52px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.two{grid-template-columns:1fr}}
.alert{padding:10px 12px;border-radius:8px;margin-bottom:14px;background:var(--warnbg);color:#7a5200;border:1px solid #f0d58a}
.thumb{max-width:150px;max-height:110px;border-radius:6px;border:1px solid var(--line);display:block;margin-top:6px}
.empty{color:var(--mut);padding:18px;text-align:center}
/* report */
.paper{background:#fff;max-width:900px;margin:0 auto;padding:30px 34px;border:1px solid var(--line);border-radius:6px;font-size:13px}
.paper h1{color:var(--navy);font-size:22px}
.paper .meta{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid var(--navy);padding-bottom:10px;margin-bottom:14px}
.paper h2{background:var(--navy);color:#fff;padding:5px 10px;font-size:13px;margin:16px 0 8px;border-radius:3px}
.paper table td,.paper table th{white-space:normal;border:1px solid #ccd3df;padding:5px 8px}
.paper table th{position:static;background:#e8edf5;color:#1b2333}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}.kv div{display:flex;gap:8px}.kv b{min-width:150px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}.photos figure{margin:0;border:1px solid #ccd3df;padding:4px}.photos img{width:100%;height:150px;object-fit:cover;display:block}.photos figcaption{font-size:11px;color:#555;padding-top:3px}
.sig{display:flex;gap:40px;margin-top:36px}.sig div{flex:1;border-top:1px solid #333;padding-top:4px;font-size:12px}
@media print{
 @page{size:A4;margin:12mm}
 body{background:#fff}.no-print,header.top{display:none!important}
 main{padding:0;max-width:none}
 .paper{border:0;padding:0;max-width:none;border-radius:0}
 .paper h2{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .paper table th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 tr,figure{break-inside:avoid}
}

.drop{border:2px dashed #9cc4ee;border-radius:9px;padding:14px;text-align:center;color:#2E75B6;cursor:pointer;background:#f5f9fe;font-weight:600}
.drop:hover,.drop.over{background:#e3effb;border-color:#2E75B6}
.drop small{display:block;font-weight:400;color:#667085;margin-top:2px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tb{position:relative}
.tb img{width:120px;height:90px;object-fit:cover;border-radius:6px;border:1px solid #d9dee8;display:block;cursor:zoom-in}
.tb button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:13px;line-height:22px;padding:0}
.dphoto{border:1px solid #d9dee8;border-radius:9px;padding:10px;margin-bottom:10px}
.dphoto .hd{font-size:13px;margin-bottom:6px}
.photos figure{break-inside:avoid}
img.ploading{background:#e7ebf3}
img.pmissing{background:#fde8e6}
.tblwrap{overflow-x:auto}
@media (max-width:700px){
 body{font-size:15px}
 header.top{padding:0 10px;gap:0;position:sticky}
 .brand{padding:10px 0 2px;font-size:15px}
 #saved{width:100%;padding-bottom:4px;font-size:11px;white-space:normal}
 nav{flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto;width:100%;order:3;-webkit-overflow-scrolling:touch;scrollbar-width:none}
 nav::-webkit-scrollbar{display:none}
 nav button{padding:10px 11px;white-space:nowrap;flex:0 0 auto}
 main{padding:12px 10px}
 .card{padding:12px;border-radius:9px;margin-bottom:12px}
 h1{font-size:18px}
 .sub{font-size:13px}
 input,select,textarea{font-size:16px;padding:9px 10px}
 button.btn{padding:10px 14px}
 button.btn.sm{padding:7px 11px;font-size:13px}
 button.now{padding:0 12px}
 .grid{grid-template-columns:1fr;gap:10px}
 .grid .w2,.grid .wide{grid-column:auto}
 .f.chk{padding-top:4px}
 .row>input[type=search],.row>select{max-width:none!important;flex:1 1 100%}
 .row>input[type=date]{flex:1 1 38%}
 .row>.spacer{display:none}
 .row>h1{flex:1 1 100%;margin:4px 0 0;font-size:17px}
 .dside{order:0;position:static}
 .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .kpi{padding:10px}
 .kpi b{font-size:19px}
 .two{grid-template-columns:1fr;gap:0}
 table.resp thead{display:none}
 table.resp,table.resp tbody,table.resp tr,table.resp td{display:block;width:100%}
 table.resp tr{border:1px solid var(--line);border-radius:9px;margin:0 0 8px;padding:6px 2px;background:#fff}
 table.resp td{border:0;padding:3px 10px;white-space:normal;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right;min-height:24px}
 table.resp td::before{content:attr(data-label);font-weight:600;color:var(--mut);text-align:left;font-size:13px;flex:0 1 auto}
 table.resp td[data-label=""]::before{display:none}
 table.resp td[data-label=""]{justify-content:flex-end}
 table.resp td.empty,table.resp td[colspan]{display:block;text-align:center}
 table.resp td:empty{display:none}
 .tw{max-height:none;overflow:visible}
 .card.tw{background:transparent;border:0;padding:0!important}
 .card .tw table.resp tr{background:#fbfcfe}
 td input,td select{min-width:0;max-width:62%}
 .paper{padding:14px;font-size:12px}
 .paper .meta{flex-direction:column;gap:6px}
 .paper h1{font-size:18px}
 .kv{grid-template-columns:1fr}
 .kv b{min-width:120px}
 .photos{grid-template-columns:repeat(2,1fr)}
 .photos img{height:120px}
 .srow{grid-template-columns:105px 1fr 44px}
 .tb img{width:92px;height:70px}
 .line{padding:10px}
 .line .hd{flex-wrap:wrap}
 .detail{gap:12px}
 .alert{margin:10px 10px 0!important}
 .sig{gap:14px}
 label.row{flex-wrap:nowrap;align-items:flex-start}
 label.row input[type=checkbox]{margin-top:3px;flex:0 0 auto}
 table.resp td.mh{display:none}
 table.resp td:first-child{font-size:16px;border-bottom:1px solid var(--line);margin-bottom:4px;padding-bottom:6px}
 header.top{gap:0 10px}
}

.dlg-back{position:fixed;inset:0;background:rgba(15,25,45,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:#fff;border-radius:12px;padding:18px;max-width:440px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.dlg h2{margin-bottom:8px}
.dlg-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.errbox{background:#fde8e6;border:1px solid #e0a39b;color:#7a1d12;border-radius:9px;padding:12px;margin:12px;font-size:13px;white-space:pre-wrap;word-break:break-word}
.ver{font-size:10px;opacity:.6;font-weight:400;margin-left:6px}
</style></head>

    var v = document.getElementById('view'); if (!v) return;
    var d = document.createElement('div'); d.className = 'errbox';
    d.textContent = 'Something went wrong while starting the tracker (v2.3).\n\n' + msg + '\n\nPlease send a screenshot of this message.\nBrowser: ' + navigator.userAgent;
    v.insertBefore(d, v.firstChild);

  var off = 0; try { throw new Error('x'); } catch (er) { var fr = String(er.stack || '').split('\n')[1] || ''; var m = /:(\d+):\d+\)?\s*$/.exec(fr); if (m) off = +m[1] - 182; }
  window.addEventListener('error', function (e) {
    var info = (e.message || 'Error') + (e.lineno ? ' (page line ' + e.lineno + ', col ' + e.colno + ')' : '');
    try {
      var app = document.getElementById('app'), fl = e.lineno - off, k = fl - 196;
      if (app && k >= 0) { var ln = app.textContent.split('\n')[k] || '', c = Math.max(0, (e.colno || 1) - 1);
        var bad = ln.charAt(c); info += '\nFile line ' + fl + ', text: ' + ln.slice(Math.max(0, c - 70), c) + ' >>' + bad + '<< ' + ln.slice(c + 1, c + 40) + '\nchar code: ' + (bad ? bad.charCodeAt(0) : 'none') + ', line length: ' + ln.length; }
    } catch (x) { }
    show(info);
  });
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; show('Unhandled: ' + (r && (r.message || r)) ); });
  setTimeout(function () { if (!window.__ftAlive) show('The app code did not start. Most likely Index.html was not pasted completely (it must end with </' + 'html>), or this browser is blocking scripts on this page.'); }, 8000);
})();
</script>
