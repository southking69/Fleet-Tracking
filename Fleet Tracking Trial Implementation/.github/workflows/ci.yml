# CI for the Jalal Service Tracker build: everything that can run WITHOUT a Fleetbase install.
#
# What this proves: PHP syntax, the pure-PHP calculation engine against the original JavaScript (expected values generated by
# executing the real functions of src/Index.html), the real-data importer mapping parity, static compatibility of the
# extension against the REAL core-api 1.6.68 / fleetops 0.6.71 sources, the cross-layer API contract, the Navigator offline
# queue (Jest) and types (tsc), and Ember lint.
# What it does NOT prove: that the extension boots inside Fleetbase, MySQL migrations, controllers, PDF/Excel output, the
# Ember build or the React Native build. That is what integration.yml (manual) is for, and it has never run (ops/RISKS.md R-01).
#
# Repository layout assumed: this file lives at <repo>/.github/workflows/ and <repo> contains service-tracker/, navigator-screens/,
# src/ (the original tracker, the parity oracle) and ops/.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  CORE_API_TAG: v1.6.68
  FLEETOPS_TAG: v0.6.71

jobs:
  php-lint:
    name: php -l (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"] # package requires ^8.1; Fleetbase 0.7.x images run 8.2
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every PHP file
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r -d '' f; do
            php -l "$f" >/dev/null || { echo "::error file=$f::php -l failed"; php -l "$f" || true; exit 1; }
            n=$((n+1))
          done < <(find service-tracker ops -name '*.php' -not -path '*/vendor/*' -not -path '*/node_modules/*' -print0)
          echo "php -l clean on $n files"

  engine-tests:
    name: Engine parity (shim runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - name: Calculation engine vs the original JavaScript (EngineShimRunner)
        working-directory: service-tracker/server
        run: php tests/Unit/EngineShimRunner.php
      - name: Real-data mapping, vehicles, petty cash, dashboard (RealDataShimRunner)
        working-directory: service-tracker/server
        run: php tests/Unit/RealDataShimRunner.php

  phpunit:
    # Same tests under real PHPUnit 11 (plus CatalogSeedTest, which the shim cannot run). Never run in the build sandbox
    # (packagist was unreachable there), so a failure here may be a config problem rather than a code problem: advisory for now.
    name: PHPUnit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - name: Install PHPUnit
        working-directory: service-tracker/server/tests
        run: composer install --no-interaction --no-progress
      - name: Run PHPUnit
        working-directory: service-tracker/server
        run: tests/vendor/bin/phpunit --no-configuration --bootstrap tests/Unit/EngineBootstrap.php --fail-on-warning tests/Unit

  realdata-parity:
    name: Real-data parity (node oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - name: Regenerate expectations by executing the real Index.html functions
        working-directory: service-tracker/server/tests/realdata
        run: |
          set -euo pipefail
          node make-stress.js
          node oracle.js fleet-data.json ../../../../src/Index.html expected.realdata.json
          node oracle.js backup-2026-10-11.stripped.json ../../../../src/Index.html expected.backup.json
          node oracle.js fleet-data.stress.json ../../../../src/Index.html expected.stress.json
      - name: Committed expectations / stress data must equal the regenerated ones
        run: git diff --exit-code -- service-tracker/server/tests/realdata
      - name: PHP pipeline vs the oracle (production file, app backup, stress variant)
        working-directory: service-tracker/server
        run: php tests/realdata/run.php --all

  fleetbase-compat:
    name: Compatibility with real core-api / fleetops sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - name: Clone core-api and fleetops at the pinned tags
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ref"
          git clone --depth 1 --branch "$CORE_API_TAG" https://github.com/fleetbase/core-api.git "$RUNNER_TEMP/ref/core-api"
          git clone --depth 1 --branch "$FLEETOPS_TAG" https://github.com/fleetbase/fleetops.git "$RUNNER_TEMP/ref/fleetops"
      - name: verify_fleetbase_compat.php
        working-directory: service-tracker/server
        run: php tests/Verify/verify_fleetbase_compat.php "$RUNNER_TEMP/ref"

  contract:
    name: API contract (Ember + Navigator vs server routes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node service-tracker/tests/contract/check-contract.mjs

  navigator:
    name: Navigator additions (Jest + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: navigator-screens/_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: navigator-screens/_dev/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Jest (offline queue, airplane-mode visit, wire format, translations)
        run: npx jest --config jest.config.js
      - name: tsc --noEmit (strict) against stubs of navigator-app
        run: bash typecheck.sh

  ember-lint:
    name: Ember engine lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the lint toolchain only (the engine's own dependencies are not installed)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lint"
          cd "$RUNNER_TEMP/lint"
          echo '{"name":"lint-tools","private":true}' > package.json
          npm install --no-audit --no-fund --ignore-scripts \
            eslint@8.57.1 eslint-plugin-ember@11.12.0 eslint-plugin-n@16.6.2 \
            @babel/core@7.25.2 @babel/eslint-parser@7.25.1 @babel/plugin-proposal-decorators@7.24.7 ember-template-lint@5.13.0
          ln -s "$RUNNER_TEMP/lint/node_modules" "$GITHUB_WORKSPACE/service-tracker/node_modules"
      - name: eslint
        working-directory: service-tracker
        run: ./node_modules/.bin/eslint addon app index.js ember-cli-build.js config
      - name: ember-template-lint
        working-directory: service-tracker
        run: ./node_modules/.bin/ember-template-lint 'addon/**/*.hbs'

  ops-checks:
    name: Ops files (YAML, shell, compose, smoke script self-test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck jq unzip
      - name: YAML parses (workflows + compose override; Compose-only tags are tolerated)
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          class L(yaml.SafeLoader): pass
          for tag in ("!override", "!reset"):
              L.add_constructor(tag, lambda l, n: l.construct_sequence(n) if isinstance(n, yaml.SequenceNode) else l.construct_scalar(n))
          files = glob.glob(".github/workflows/*.yml") + glob.glob("ops/*.yml")
          for f in files:
              yaml.load(open(f), L)
              print("ok", f)
          print(len(files), "files")
          PY
      - name: bash -n and shellcheck
        run: |
          set -euo pipefail
          files=$(find ops -name '*.sh')
          for f in $files; do bash -n "$f"; done
          # shellcheck is run at warning level: style notes in the docs-heavy scripts are not gating
          shellcheck -S warning $files
          echo "checked: $files"
      - name: docker compose config against the stock Fleetbase compose file
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/fleetbase/fleetbase.git "$RUNNER_TEMP/fb"
          cd "$RUNNER_TEMP/fb"
          cp "$GITHUB_WORKSPACE/ops/docker-compose.override.yml" docker-compose.override.yml
          cp "$GITHUB_WORKSPACE/ops/.env.example" .env
          sed -i 's/^APP_KEY=$/APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=/; s/^DB_ROOT_PASSWORD=$/DB_ROOT_PASSWORD=ci-root/; s/^DB_PASSWORD=$/DB_PASSWORD=ci-app/' .env
          mkdir -p api console && touch api/.env
          docker compose config -q
          docker compose config | grep -q 'jalal-ops/Dockerfile.api'
          # nothing but loopback may be published
          pub=$(docker compose config | grep -c 'published:')
          loop=$(docker compose config | grep -c 'host_ip: 127.0.0.1')
          echo "published ports: $pub, bound to 127.0.0.1: $loop"
          [ "$pub" -gt 0 ] && [ "$pub" = "$loop" ]
          echo "compose config OK"
      - name: smoke.sh self-test and a run against the mock server (tests the SCRIPT, not Fleetbase)
        run: |
          set -euo pipefail
          bash ops/smoke/smoke.sh --selftest
          MOCK_PORT=18765 python3 ops/smoke/mock_server.py service-tracker/server/tests/fixtures/expected.json &
          MOCK=$!
          sleep 1
          BASE_URL=http://127.0.0.1:18765 SMOKE_API_KEY_A=SMOKEKEY_A SMOKE_API_KEY_B=SMOKEKEY_B \
            SMOKE_USER_A_EMAIL=smoke-a@x SMOKE_USER_A_PASSWORD=p SMOKE_USER_B_EMAIL=smoke-b@x SMOKE_USER_B_PASSWORD=p \
            ORDER_SLEEP=0 PDF_COMBOS=all bash ops/smoke/smoke.sh
          kill "$MOCK"
          # the script must go red when the server disagrees with the fixture
          MOCK_PORT=18766 python3 ops/smoke/mock_server.py service-tracker/server/tests/fixtures/expected.json wrong &
          MOCK=$!
          sleep 1
          if BASE_URL=http://127.0.0.1:18766 SMOKE_API_KEY_A=SMOKEKEY_A SMOKE_API_KEY_B=SMOKEKEY_B \
            SMOKE_USER_A_EMAIL=smoke-a@x SMOKE_USER_A_PASSWORD=p SMOKE_USER_B_EMAIL=smoke-b@x SMOKE_USER_B_PASSWORD=p \
            ORDER_SLEEP=0 bash ops/smoke/smoke.sh >/dev/null; then echo "smoke.sh did not fail on wrong numbers"; kill "$MOCK"; exit 1; fi
          kill "$MOCK"
          echo "negative control OK"
